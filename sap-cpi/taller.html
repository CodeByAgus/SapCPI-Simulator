<body>

<div class="app">
  <header class="top">
    <a class="back" href="index.html">← SAP CPI</a>
    <div class="brand">
      <svg viewBox="0 0 40 24" aria-hidden="true"><circle cx="5" cy="12" r="4" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M9 12h5" stroke="var(--ink)" stroke-width="1.4"/><rect x="14" y="5" width="13" height="14" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M27 12h4" stroke="var(--ink)" stroke-width="1.4"/><circle cx="35" cy="12" r="4" fill="none" stroke="var(--ink)" stroke-width="2.6"/></svg>
      <div><h1>Taller de iFlows</h1><small>Práctica de Cloud Integration (SAP Integration Suite)</small></div>
    </div>
    <div class="exsel">
      <label for="exSelect">Ejercicio</label>
      <select id="exSelect"></select>
      <span id="progress" class="pill"></span>
    </div>
    <div class="actions">
      <button id="btnTour" type="button" title="Guía paso a paso del taller">Cómo se usa</button>
      <button id="btnCheck" type="button" title="Revisa errores de modelado, como el botón Check del editor">Check</button>
      <button id="btnRun" type="button" title="Ejecuta el iFlow con el mensaje de prueba">Probar</button>
      <button id="btnVerify" type="button" class="primary">Verificar ejercicio</button>
    </div>
  </header>

  <aside class="palette" id="palette" aria-label="Paleta de elementos"></aside>

  <main class="stage">
    <div class="stage-bar">
      <span class="tip" id="tip"></span>
      <div class="zoom">
        <button type="button" id="zOut" aria-label="Alejar">−</button>
        <span id="zVal">100%</span>
        <button type="button" id="zIn" aria-label="Acercar">+</button>
        <button type="button" id="zFit">Ajustar</button>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </main>

  <section class="panel" aria-label="Panel">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="ej" id="t-ej">Ejercicio</button>
      <button type="button" role="tab" data-tab="prop" id="t-prop">Propiedades</button>
      <button type="button" role="tab" data-tab="test" id="t-test">Probar</button>
    </nav>
    <div class="tabbody" id="tab-ej"></div>
    <div class="tabbody" id="tab-prop" hidden></div>
    <div class="tabbody" id="tab-test" hidden>
      <label class="fld"><span>Body de entrada</span><textarea id="simBody" class="code" rows="7" spellcheck="false"></textarea></label>
      <label class="fld"><span>Headers de entrada (uno por línea: nombre=valor)</span><textarea id="simHeaders" class="code" rows="3" spellcheck="false"></textarea></label>
      <div class="btnrow">
        <button type="button" data-act="sample">Usar entrada del ejercicio</button>
        <button type="button" data-act="run" class="primary">Ejecutar iFlow</button>
      </div>
      <div id="simOut"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="../tour.js?v=1"></script>
<script src="taller.js?v=7"></script>
</body>
