// la lista de planos: [t0, escena]. Todos los cortes caen en la grilla de 8vos (0.25s).
const SHOT_LIST = [
  [0.0,  'wish'],      // 1 querés aprender
  [2.0,  'license'],   // 2 la licencia frena a la flecha
  [5.5,  'turn'],      // 3 (morph candado → flecha en 5.5) «Con flowDev, no.»
  [6.5,  'home'],      // 4 el sitio real
  [8.0,  'stepTheory'],
  [10.0, 'stepFlow'],
  [12.0, 'stepRun'],
  [14.0, 'stepVerify'],
  [16.0, 'rush0'], [16.5, 'rush1'], [17.0, 'rush2'], [17.5, 'rush3'],
  [18.0, 'hush'],      // 7 silencio: vuelve la etiqueta de precio
  [19.0, 'free'],      // 8 el golpe: $0 · Gratis
  [22.0, 'end'],       // 9 el inicio, cambiado
];
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, () => SCENES[sc]()]);
const SHOTS = SHOT_LIST.map(([t0, sc], i) => [sc, i, t0, ERA_LIST[i][1], sc]);
const TIMELINE = {

  cuts: [2.0, 6.5, 8.0, 10.0, 12.0, 14.0, 16.0, 16.5, 17.0, 17.5, 18.0, 19.0, 22.0],
